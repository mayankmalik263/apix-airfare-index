# Vercel deployment manifest. Serving subset only: same list as
# requirements-web.txt (no Playwright, no Scrapling: the web app imports
# neither). requirements.txt stays the collector's manifest.
[project]
name = "apix"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "slowapi>=0.1.10",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

# Not an installable package: flat layout with several top-level dirs.
[tool.uv]
package = false

[tool.vercel]
entrypoint = "webapp.backend.app:app"

[tool.vercel.scripts]
build = "python -m scripts.vercel_build"
